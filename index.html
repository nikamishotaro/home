<!DOCTYPE html> 
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nikamishotaro computer</title>
    <style>
        /* 全体の設定 */
        body {
            font-family: "Kozuka Gothic Pr6N", "Kozuka Gothic Pro", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
            margin: 0;
            padding: 0;
            color: #00ff01;
            line-height: 1.6;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            
            background-image: url('images/background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #f0f0f0; 
        }

        .header-container {
            max-width: 900px;
            margin: 100px auto 60px;
            padding: 0 40px;
        }

        .welcome-header {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-align: left;
            margin: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        a:hover {
            opacity: 0.5;
        }

        /* --------------------------------------------------
           配置の操作用スタイル
        -------------------------------------------------- */

        /* 上段・下段を包む全体の枠組み */
        .layout-wrapper {
            /* 調整：全体の横幅。ここを大きくすると3つの列が広がります */
            width: 1050px; 
            margin: 0 auto;
        }

        /* ①② 上段リンクの設定 */
        .link-container {
            display: flex;
            /* 調整：3つのボタンの間の隙間 */
            justify-content: space-between; 
            padding: 0;
        }

        .item {
            /* 調整：ボタン1つあたりの幅。文字を一行で収めるために広げました */
            width: 320px; 
            /* ② ボタンと説明文の先頭を左端で揃える設定 */
            text-align: left; 
        }

        .item-name {
            /* ① 改行させず一行に収める指定 */
            white-space: nowrap; 
            font-size: 1.5rem;
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .description {
            font-size: 0.9rem;
            color: #00ff01;
            margin: 0;
        }

        /* ③④ 下段（SHOP/BUSINESS）の設定 */
        .sub-container {
            /* 調整：上段との距離 */
            margin-top: 80px; 
            display: flex;
            /* 調整：上段の「隙間」に配置されるよう、両端を空けて配置 */
            justify-content: space-around; 
            /* 下段全体の幅を上段より少し狭めることで、隙間に収まりやすくなります */
            padding: 0 100px; 
        }

        .sub-name {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="welcome-header">
            Hi, My name is Nikami Shotaro. Nice to meet you. I'm fine, thank you. And you?
        </h1>
    </div>

    <div class="layout-wrapper">
        <div class="link-container">
            <div class="item">
                <a href="realname.html" class="item-name">二上 匠太郎（real）</a>
                <p class="description">researcher and philosophize.</p>
            </div>
            <div class="item">
                <a href="handlename.html" class="item-name">Kim Diehl（handle）</a>
                <p class="description">twitter, instagram, note...all I have are like that.</p>
            </div>
            <div class="item">
                <a href="artistname.html" class="item-name">Leikh Ooy, nostalghia（artist）</a>
                <p class="description">musics, graphics, and so on.</p>
            </div>
        </div>

        <div class="sub-container">
            <a href="shop.html" class="sub-name">SHOP</a>
            <a href="business.html" class="sub-name">BUSINESS</a>
        </div>
    </div>

</body>
</html>
