<!DOCTYPE html> 
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nikamishotaro computer</title>
    <style>
        /* 全体の設定 */
        body {
            /* ① フォント指定：小塚ゴシックを優先し、代替として游ゴシックなどを設定 */
            font-family: "Kozuka Gothic Pr6N", "Kozuka Gothic Pro", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
            margin: 0;
            padding: 0;
            color: #333; /* 文字色（背景が白い場合） */
            line-height: 1.6;
            text-align: center;
            min-height: 100vh;
            
            /* ⑤ 背景画像の設定 */
            background-image: url('images/background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* ① メインの挨拶文 */
        .welcome-header {
            font-size: 2.5rem; /* サイズ調整 */
            font-weight: bold;
            margin: 100px 20px 60px;
            letter-spacing: 0.05em;
        }

        /* リンク共通のスタイル */
        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        a:hover {
            opacity: 0.5;
        }

        /* ②・③ メインリンクのレイアウト */
        .link-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        .item {
            width: 250px;
        }

        .item-name {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 10px;
        }

        .description {
            font-size: 0.9rem;
            color: #666;
            text-align: left; /* 説明文は左寄せが見やすいです */
        }

        /* ④ 下段リンク（SHOP, business） */
        .sub-container {
            margin-top: 80px;
            display: flex;
            justify-content: center;
            gap: 50px;
            padding-bottom: 100px;
        }

        .sub-name {
            font-size: 1.5rem; /* 上段と同じ大きさに設定 */
        }
    </style>
</head>
<body>

    <h1 class="welcome-header">
        Hi, My name is Nikami Shotaro. Nice to meet you.<br>
        I'm fine, thank you. And you?
    </h1>

    <div class="link-container">
        <div class="item">
            <a href="index.html" class="item-name">二上匠太郎</a>
            <p class="description">ここに二上匠太郎に関する説明文を記載します。テキストを置き換えてください。</p>
        </div>
        <div class="item">
            <a href="kim-diehl.html" class="item-name">Kim Diehl</a>
            <p class="description">Kim Diehlに関するプロジェクトの説明文です。アンビエントや電子音楽の活動について。</p>
        </div>
        <div class="item">
            <a href="leikh-ooy.html" class="item-name">Leikh Ooy, nostalghia</a>
            <p class="description">Leikh Ooy, nostalghiaとしての活動内容です。ノイズ、フィールドレコーディングなど。</p>
        </div>
    </div>

    <div class="sub-container">
        <a href="shop.html" class="sub-name">SHOP</a>
        <a href="business.html" class="sub-name">business</a>
    </div>

</body>
</html>
