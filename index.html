<!DOCTYPE html> 
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nikamishotaro computer</title>
    <style>
        /* 全体の設定 */
        body {
            font-family: "Kozuka Gothic Pr6N", "Kozuka Gothic Pro", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
            margin: 0;
            padding: 0;
            color: #00ffff;
            line-height: 1.6;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            
            background-image: url('images/background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #f0f0f0; 
        }

        .header-container {
            max-width: 900px;
            margin: 100px auto 60px;
            padding: 0 40px;
        }

        .welcome-header {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-align: left;
            margin: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        a:hover {
            opacity: 0.5;
        }

        /* --------------------------------------------------
           配置の操作用スタイル
        -------------------------------------------------- */

        .layout-wrapper {
            width: 1050px; 
            margin: 0 auto;
        }

        .link-container {
            display: flex;
            justify-content: space-between; 
            padding: 0;
        }

        .item {
            width: 320px; 
            text-align: left; 
        }

        .item-name {
            white-space: nowrap; 
            font-size: 1.5rem;
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .description {
            font-size: 0.9rem;
            color: #00ffff;
            margin: 0;
        }

        .sub-container {
            margin-top: 80px; 
            display: flex;
            justify-content: space-around; 
            padding: 0 100px; 
        }

        .sub-name {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* --------------------------------------------------
           ①② スマホ用（レスポンシブ）の設定
        -------------------------------------------------- */
        @media (max-width: 768px) {
            body {
                overflow-y: auto; /* スマホでボタンが多くなり画面を越える場合はスクロールを許可 */
            }

            .header-container {
                margin: 40px auto 20px;
                padding: 0 20px;
            }

            /* ① スマホで画面いっぱいに4回改行するくらいのサイズに調整 */
            .welcome-header {
                font-size: 1.8rem; /* 画面幅に合わせて微調整してください */
                word-wrap: break-word;
            }

            /* ② 全体を縦並びに変更 */
            .layout-wrapper {
                width: 100%;
                padding: 0 20px;
                box-sizing: border-box;
            }

            .link-container {
                flex-direction: column; /* 縦に並べる */
                gap: 30px;
            }

            .item {
                width: 100%;
            }

            .item-name {
                white-space: normal; /* スマホでは改行を許可 */
            }

            .sub-container {
                flex-direction: column; /* 縦に並べる */
                margin-top: 30px;
                padding: 0;
                gap: 30px;
                padding-bottom: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="welcome-header">
            Hi, My name is Nikami Shotaro. Nice to meet you. I'm fine, thank you. And you?
        </h1>
    </div>

    <div class="layout-wrapper">
        <div class="link-container">
            <div class="item">
                <a href="realname.html" class="item-name">二上 匠太郎（real）</a>
                <p class="description">research and philosophize.</p>
            </div>
            <div class="item">
                <a href="handlename.html" class="item-name">Kim Diehl（handle）</a>
                <p class="description">twitter, instagram, note... all I have<br>
                    are like that.</p>
            </div>
            <div class="item">
                <a href="artistname.html" class="item-name">Leikh Ooy, nostalghia（artist）</a>
                <p class="description">musics, graphics, and so on.</p>
            </div>
        </div>

        <div class="sub-container">
            <a href="shop.html" class="sub-name">SHOP</a>
            <a href="business.html" class="sub-name">BUSINESS</a>
        </div>
    </div>

</body>
</html>
