<!DOCTYPE html> 
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nikamishotaro computer</title>
    <style>
        /* 全体の設定 */
        body {
            /* ① フォントをMS Pゴシック主体の設定に変更 */
            font-family: "MS PGothic", "ＭＳ Ｐゴシック", "MS PMincho", "ＭＳ Ｐ明朝", sans-serif;
            margin: 0;
            padding: 0;
            color: #00ffff;
            line-height: 1.6;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            
            background-image: url('images/background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #f0f0f0; 
        }

        .header-container {
            /* ③ 横幅を下の .layout-wrapper と同じ 1050px に設定 */
            max-width: 1050px;
            /* ④【調整箇所：上の余白と下の余白】 
               「100px」が上、「100px」が下のリンクとの間隔（要求②）です */
            margin: 100px auto 100px;
            padding: 0;
            box-sizing: border-box;
        }

        .welcome-header {
            /* ③【調整箇所：フォントサイズ】 
               1050px幅に収まるよう 2.95rem に調整しています。微調整はここを変更してください */
            font-size: 2.95rem; 
            font-weight: bold;
            letter-spacing: 0.05em;
            text-align: left;
            margin: 0;
            white-space: normal;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        a:hover {
            opacity: 0.5;
        }

        /* --------------------------------------------------
            配置の操作用スタイル
        -------------------------------------------------- */

        .layout-wrapper {
            width: 1050px; 
            margin: 0 auto;
        }

        .link-container {
            display: flex;
            justify-content: space-between; 
            padding: 0;
        }

        /* ブロック全体をリンク化するため display: block に変更 */
        .item {
            width: 320px; 
            text-align: left; 
            display: block;
        }

        /* ▼▼▼ ①-c 画像サイズの変更指示コメント ▼▼▼ */
        .block-image {
            /* 新たに配置した画像の大きさを変更する場合は、以下の数値を修正してください。
               現状は幅いっぱいの正方形（320px × 320px）になるよう設定されています。
               固定の大きさにしたい場合は「width: 200px; height: 200px;」などに書き換えてください。
            */
            width: 100%;
            aspect-ratio: 1 / 1;
            /* ------------------------------------------------------------------- */
            object-fit: cover;
            display: block;
            margin-bottom: 15px; /* タイトルとの間隔 */
            background-color: #333333; /* 画像が読み込めない時のダミー背景色 */
        }
        /* ▲▲▲ 画像サイズの変更指示コメント ここまで ▲▲▲ */

        .item-name {
            /* ①-c タイトルのフォントをMS Pゴシックに変更 */
            font-family: "MS PGothic", "ＭＳ Ｐゴシック", sans-serif;
            white-space: nowrap; 
            font-size: 1.5rem;
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .description {
            font-size: 0.9rem;
            color: #00ffff;
            margin: 0;
        }

        .sub-container {
            margin-top: 80px; 
            display: flex;
            /* ①-a オリンピックロゴのような均等配置（上段の隙間をセンターにする）ための調整 */
            justify-content: center;
            gap: 45px; 
        }

        .sub-name {
            /* ①-c タイトルのフォントをMS Pゴシックに変更 */
            font-family: "MS PGothic", "ＭＳ Ｐゴシック", sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            display: block; /* 構造変更に伴うレイアウト維持のため追加 */
        }

        /* --------------------------------------------------
            スマホ用（レスポンシブ）の設定
        -------------------------------------------------- */
        @media (max-width: 768px) {
            body {
                overflow-y: auto; 
            }

            .header-container {
                /* ▼▼▼ ② SP版：テキストと下の画像との間隔の変更指示コメント ▼▼▼ */
                /* SP版限定の「Hi, My name is...」と下部の画像との間隔（現在約5倍に設定）を変更する場合は、
                   以下の「margin: 40px auto 100px;」の【100px】の数値を修正してください。
                */
                margin: 40px auto 100px;
                /* ▲▲▲ SP版間隔の変更指示コメント ここまで ▲▲▲ */
                padding: 0 20px;
                max-width: 100%;
            }

            .welcome-header {
                font-size: 1.8rem; 
                word-wrap: break-word;
            }

            .layout-wrapper {
                width: 100%;
                padding: 0 20px;
                box-sizing: border-box;
            }

            .link-container {
                flex-direction: column; 
                gap: 30px;
            }

            .item {
                width: 100%;
            }

            .item-name {
                white-space: normal; 
            }

            .sub-container {
                flex-direction: column; 
                margin-top: 30px;
                padding: 0;
                gap: 30px;
                padding-bottom: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="welcome-header">
            Hi, My name is Nikami Shotaro. Nice to meet you. I'm fine, thank you. And you?
        </h1>
    </div>

    <div class="layout-wrapper">
        <div class="link-container">
            <a href="realname.html" class="item">
                <img src="images/dummy1.jpg" alt="" class="block-image"> <span class="item-name">二上 匠太郎（real）</span>
                <p class="description">research and philosophize.</p>
            </a>
            
            <a href="handlename.html" class="item">
                <img src="images/handle_background.jpg" alt="" class="block-image"> <span class="item-name">Kim Diehl（handle）</span>
                <p class="description">twitter, instagram, note... all I have<br>
                    are like that.</p>
            </a>
            
            <a href="artistname.html" class="item">
                <img src="images/leihk-ooy_prof.jpg" alt="" class="block-image"> <span class="item-name">Leikh Ooy, nostalghia（artist）</span>
                <p class="description">musics, graphics, and so on.</p>
            </a>
        </div>

        <div class="sub-container">
            <a href="shop.html" class="item">
                <img src="images/dummy4.jpg" alt="" class="block-image"> <span class="sub-name">SHOP</span>
            </a>
            
            <a href="business.html" class="item">
                <img src="images/dummy5.jpg" alt="" class="block-image"> <span class="sub-name">BUSINESS</span>
            </a>
        </div>
    </div>

</body>
</html>
