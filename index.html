<!DOCTYPE html> 
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nikamishotaro computer</title>
    <style>
        /* 全体の設定 */
        body {
            font-family: "Kozuka Gothic Pr6N", "Kozuka Gothic Pro", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            line-height: 1.6;
            height: 100vh;
            overflow: hidden; /* 画面からはみ出た部分を隠してスクロールさせない */
            display: flex;
            flex-direction: column;
            
            /* ④ 背景画像の設定 */
            /* 画像ファイルを images フォルダに入れ、名前を background.jpg にしてください */
            background-image: url('images/background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #f0f0f0; /* 画像がない時の予備色 */
        }

        /* ① メインの挨拶文：ブロックとして中央に寄せ、中身は左詰めに */
        .header-container {
            max-width: 900px; /* 挨拶文の最大幅 */
            margin: 100px auto 60px; /* 上下に余白を作り、左右中央に配置 */
            padding: 0 40px;
        }

        .welcome-header {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-align: left; /* 二行目以降を左詰めに */
            margin: 0;
        }

        /* リンク共通のスタイル */
        a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        a:hover {
            opacity: 0.5;
        }

        /* ②・③ メインリンクのレイアウト */
        .link-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            padding: 0 20px;
            flex-wrap: wrap;
            text-align: center;
        }

        .item {
            width: 250px;
        }

        .item-name {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .description {
            font-size: 0.9rem;
            color: #555;
            text-align: left;
        }

        /* ④ 下段リンク（SHOP, BUSINESS） */
        .sub-container {
            margin-top: 80px;
            display: flex;
            justify-content: center;
            gap: 50px;
            padding-bottom: 100px;
        }

        .sub-name {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="welcome-header">
            Hi, My name is Nikami Shotaro. Nice to meet you. I'm fine, thank you. And you?
        </h1>
    </div>

    <div class="link-container">
        <div class="item">
            <a href="profile.html" class="item-name">二上 匠太郎</a>
            <p class="description">researcher and philosophize.</p>
        </div>
        <div class="item">
            <a href="kim-diehl.html" class="item-name">Kim Diehl</a>
            <p class="description">twitter, instagram, note...all I have are like that.</p>
        </div>
        <div class="item">
            <a href="leikh-ooy.html" class="item-name">Leikh Ooy, nostalghia</a>
            <p class="description">musics, graphics, and so on.</p>
        </div>
    </div>

    <div class="sub-container">
        <a href="shop.html" class="sub-name">SHOP</a>
        <a href="business.html" class="sub-name">BUSINESS</a>
    </div>

</body>
</html>
