<!DOCTYPE html> 
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nikamishotaro computer</title>
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    
    <style>
        body {
            /* ③ 背景画像の設定：タイル状に並べるか、画面いっぱいに広げる */
            background-image: url('images/top.JPG');
            background-size: cover;
            background-attachment: fixed;
            background-color: #008080; /* Windows 95風の緑色 */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        /* ウィンドウの幅調整 */
        .window {
            width: 90%;
            max-width: 800px;
            margin: 20px 0;
        }

        /* 挨拶文のスタイル */
        .welcome-text {
            font-size: 2rem;
            font-weight: bold;
            padding: 20px;
            text-align: center;
        }

        /* ①・② メインコンテンツのグリッド */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 10px;
        }

        .project-card {
            background: #c0c0c0;
            padding: 10px;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff; /* 凹凸感を出す伝統的な手法 */
        }

        .project-card a {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000;
        }

        /* 下段リンク */
        .footer-links {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        /* 文字の色調整 */
        .window-body, h1, p {
            color: #000; /* ウィンドウ内は黒文字 */
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">nikamishotaro.exe</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <p class="welcome-text">
                Hi, My name is Nikami Shotaro. Nice to meet you. I'm <br>
                fine, thank you. And you?
            </p>

            <div class="grid-container">
                <div class="project-card">
                    <a href="index.html">二上 匠太郎</a>
                    <p>ここに二上匠太郎に関する説明文が入ります。活動内容やプロフィールなど。</p>
                </div>
                <div class="project-card">
                    <a href="kim-diehl.html">Kim Diehl</a>
                    <p>Kim Diehlに関するプロジェクトの説明です。アンビエントや電子音楽の制作について。</p>
                </div>
                <div class="project-card">
                    <a href="nostalghia.html">Leikh Ooy, nostalghia</a>
                    <p>ノイズやフィールドレコーディングの試みを記載します。</p>
                </div>
            </div>

            <div class="footer-links">
                <button><a href="shop.html" style="text-decoration:none; color:black;">SHOP</a></button>
                <button><a href="business.html" style="text-decoration:none; color:black;">business</a></button>
            </div>
        </div>
        <div class="status-bar">
            <p class="status-bar-field">Status: Online</p>
            <p class="status-bar-field">Objects: 5</p>
        </div>
    </div>

</body>
</html>
