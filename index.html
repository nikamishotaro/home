<!DOCTYPE html> 
<html lang="ja">
<head>

    <title>nikamishotaro computer</title>
    <style>
        /* 全体の設定 */
        body {
            font-family: "Kozuka Gothic Pr6N", "Kozuka Gothic Pro", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            line-height: 1.6;

            /* ここから修正：スクロールを禁止し、高さを固定 */
            height: 100vh;
            overflow: hidden; /* 画面からはみ出た部分を隠してスクロールさせない */
            display: flex;
            flex-direction: column;
            
            /* 背景画像の設定 */
            background-image: url('images/background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #f0f0f0;
        }

        /* 挨拶文とリンクの配置を調整 */
        .header-container {
            flex: 1; /* 余白を自動調整してバランスをとる */
            display: flex;
            align-items: center; /* 垂直方向の中央 */
            max-width: 900px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .welcome-header {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-align: left;
            margin: 0;
        }

        .link-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            padding: 40px 20px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.1); /* リンクが読みづらい場合、薄く背景を置く */
        }

        .sub-container {
            padding-bottom: 60px; /* 下に少し余裕を持たせる */
            display: flex;
            justify-content: center;
            gap: 50px;
        }
    </style>
</head>
<body>

    <div class="link-container">
        <div class="item">

        </div>
        <div class="item">
