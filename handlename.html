<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Diehl - nikamishotaro computer</title>
    <style>
        body {
            font-family: "Kozuka Gothic Pr6N", "Kozuka Gothic Pro", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
            margin: 0;
            padding: 0;
            color: #00ffff; /* 前回のコードに合わせたシアン色 */
            height: 100vh;
            /* タイムラインが長くなることを想定し、縦スクロールのみ許可 */
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* ③ 背景画像の設定 */
            background-image: url('images/handle_background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
        }

        /* ④ 右上の「Back to Home」ボタン */
        .back-home {
            position: absolute;
            top: 30px;
            right: 40px;
            padding: 10px 20px;
            border: 1px solid #00ffff;
            text-decoration: none;
            color: inherit;
            font-weight: bold;
            transition: opacity 0.3s;
            z-index: 100;
        }
        .back-home:hover {
            opacity: 0.5;
        }

        .page-title {
            margin-top: 80px;
            font-size: 2.5rem;
            letter-spacing: 0.1em;
            text-align: center;
        }

        /* ①と② ウィジェットを並べる枠組み */
        .sns-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            width: 90%;
            max-width: 1200px;
            margin-top: 20px;
            padding-bottom: 80px; /* スクロールした時の下の余白 */
        }

        .sns-box {
            width: 320px;
            min-height: 450px;
            border: 1px solid #00ffff;
            background: rgba(0, 0, 0, 0.7); /* 背景を少し透過させて文字を見やすく */
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        /* ① リンク兼ボタンの設定 */
        .sns-link-button {
            display: block;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ffff;
            text-decoration: none;
            border-bottom: 2px solid #00ffff;
            padding-bottom: 10px;
            margin-bottom: 20px;
            transition: opacity 0.3s;
        }
        .sns-link-button:hover {
            opacity: 0.5;
        }

        /* ② 埋め込みエリア（この中に取得したコードを貼ります） */
        .embed-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(0, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">Back to Home</a>

    <h1 class="page-title">Kim Diehl</h1>

    <div class="sns-container">
        
        <div class="sns-box">
            <a href="https://x.com/kimdiehl_?s=21&t=TNiLdtVttNRR3dYV9uExgw" target="_blank" class="sns-link-button">X (Twitter)</a>
            <div class="embed-area">
                ここにXのタイムラインが<br>自動更新で表示されます。
            </div>
        </div>

        <div class="sns-box">
            <a href="https://instagram.com/kimdiehl_" target="_blank" class="sns-link-button">Instagram</a>
            <div class="embed-area">
                ここにInstagramの最新投稿が<br>自動更新で表示されます。
            </div>
        </div>

        <div class="sns-box">
            <a href="https://note.com/kimdiehl_" target="_blank" class="sns-link-button">note</a>
            <div class="embed-area">
                ここにnoteの最新記事が<br>表示されます。
            </div>
        </div>

    </div>

</body>
</html>
