<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Diehl - nikamishotaro computer</title>
    <style>
        /* デフォルトの余白をリセット */
        /* 【要求①】見切れ防止のため、header要素もbox-sizing: border-boxの対象に追加 */
        body, h1, p, a, div, header {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 【要求⑤】スムーズなスクロールのための設定 */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #ffffff;
        }

        /* -----------------------------------
            ヘッダー
        ----------------------------------- */
        .site-header {
            /* 【要求①】左右の隙間（余白）を後で調整しやすいよう変数として定義 */
            --header-gap-x: 40px; 

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* 定義した変数を使用して左右のパディングを設定 */
            padding: 20px var(--header-gap-x);
        }

        .site-header a {
            text-decoration: none;
            color: #111;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .site-header a:hover {
            color: #888;
        }

        .header-left a {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        .nav-item {
            position: relative;
            margin-left: 35px;
            padding-bottom: 10px;
            margin-bottom: -10px;
        }

        .nav-item > a {
            font-weight: bold;
            display: block;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: -15px;
            background-color: rgba(255, 255, 255, 0.95);
            min-width: 150px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05);
            flex-direction: column;
            border-top: 2px solid #111;
        }

        .nav-item.has-dropdown:hover .dropdown {
            display: flex;
        }

        .dropdown a {
            padding: 12px 15px;
            font-size: 0.85rem;
            font-weight: normal;
            border-bottom: 1px solid #eee;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 20px;
            cursor: pointer;
            z-index: 1100;
            flex-shrink: 0;
            margin-left: 15px;
        }

        .menu-toggle span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: #111;
            transition: 0.3s;
        }

        /* -----------------------------------
            検索窓 (PC版：ヘッダー中央)
        ----------------------------------- */
        .search-container {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            width: 300px;
        }

        .search-input {
            width: 100%;
            padding: 8px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 0.9rem;
            outline: none;
        }

        /* -----------------------------------
            画像グリッドレイアウト
        ----------------------------------- */
        .grid-container {
            display: grid;
            /* 【要求②】PC版：画面幅に合わせて最大6列になるよう設定 */
            grid-template-columns: repeat(6, 1fr);
            gap: 30px;
            padding: 0 40px 60px;
            margin-top: 100px; /* ジャンル絞り込みリンクを消したため余白を追加 */
        }

        /* レスポンシブで最大列数を調整 */
        @media (max-width: 1200px) {
            .grid-container { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 992px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
        }

        .grid-item {
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .grid-item:hover .image-wrapper img {
            transform: scale(1.05);
        }

        .image-wrapper {
            width: 100%;
            /* 【要求②】画像を正方形に修正 */
            aspect-ratio: 1 / 1; 
            overflow: hidden;
            background-color: #f0f0f0;
            margin-bottom: 15px;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .grid-item-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #111;
        }
        
        .grid-item-hashtag {
            font-size: 0.85rem;
            color: #1da1f2; /* ハッシュタグらしい色に変更 */
            line-height: 1.4;
        }

        /* -----------------------------------
            SP版（スマホ）でのレスポンシブ対応
        ----------------------------------- */
        @media (max-width: 768px) {
            .site-header {
                /* 【要求①】SP版用の隙間幅を変数で定義 */
                --header-gap-x-sp: 15px; 
                padding: 15px var(--header-gap-x-sp);
            }

            .menu-toggle {
                display: flex;
            }

            .header-right {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                height: 100vh;
                background-color: #fff;
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-start;
                padding: 80px 40px;
                transition: 0.4s;
                box-shadow: -5px 0 15px rgba(0,0,0,0.1);
                overflow-y: auto;
            }

            .header-right.active {
                right: 0;
            }

            .nav-item {
                margin: 0 0 25px 0;
                width: 100%;
            }

            .nav-item > a {
                font-size: 1.2rem;
                border-bottom: 1px solid #eee;
                padding-bottom: 5px;
            }

            .dropdown {
                position: static;
                display: none;
                box-shadow: none;
                border-top: none;
                padding-left: 20px;
                background-color: transparent;
            }

            .nav-item.active .dropdown {
                display: flex;
            }

            .menu-toggle.active span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
            .menu-toggle.active span:nth-child(2) { opacity: 0; }
            .menu-toggle.active span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

            /* 【要求④】SP版：検索窓をジャンル絞り込みリンクがあった位置に配置 */
            .search-container {
                position: static;
                transform: none;
                margin: 80px 15px 20px;
                width: auto;
            }

            .grid-container {
                /* 【要求②】SP版：横に二つ並ぶように変更 */
                grid-template-columns: repeat(2, 1fr);
                padding: 0 15px 30px;
                gap: 15px;
                margin-top: 0;
            }
        }
    /* 【要求①】</st>という誤記を修正 */
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="site-header">
        <div class="header-left">
            <!-- 【要求⑤】クリックするとページ上部に自動でスクロールして戻る -->
            <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">Kim Diehl</a>
        </div>

        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="header-right" id="nav-menu">
            <!-- 【要求③④】「design」「research」「about」を削除し、「contact」を「SNS」に変更。「Back to Home」は残す。 -->
            <div class="nav-item has-dropdown">
                <a href="javascript:void(0)">SNS</a>
                <div class="dropdown">
                    <a href="#">Twitter</a>
                    <a href="#">Instagram</a>
                    <a href="#">note</a>
                </div>
            </div>
            <div class="nav-item"><a href="https://nikamishotaro.github.io/home/index.html">Back to Home</a></div>
        </div>
    </header>

    <!-- 【要求③④】ジャンル絞り込みリンクをなくし、検索窓を設置 -->
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="ハッシュタグを検索 (例: #2021)">
    </div>

    <!-- 画像グリッド -->
    <!-- 【要求②】画像アイコン・タイトル・ハッシュタグのひと塊をリンク化（既存の<a>タグを利用） -->
    <div class="grid-container" id="grid-container">
        <a href="#" class="grid-item">
            <div class="image-wrapper">
                <img src="images/俯瞰パース.png" alt="オリンピック島">
            </div>
            <div class="grid-item-title">オリンピック島（2021）</div>
            <div class="grid-item-hashtag">#オリンピック #2021 #海上建築</div>
        </a>

        <a href="https://www.sabed.jp/wp/wp-content/uploads/2021/12/20412a9f06321592bd5ab9efdd0f27bc.pdf" class="grid-item">
            <div class="image-wrapper">
                <img src="images/ワイナリー.jpg" alt="WINE SCAPE IN JAPAN">
            </div>
            <div class="grid-item-title">WINESCAPE IN JAPAN（2022）</div>
            <div class="grid-item-hashtag">#2022 #環境 #シミュレーション #ワイナリー</div>
        </a>

        <a href="#" class="grid-item">
            <div class="image-wrapper">
                <img src="images/女性の家.jpg" alt="女性の家">
            </div>
            <div class="grid-item-title">Rasing and Braiding（2022）</div>
            <div class="grid-item-hashtag">#2022 #セネガル #自力建設 #空間工法</div>
        </a>

        <a href="#" class="grid-item">
            <div class="image-wrapper">
                <img src="images/別邸.jpg" alt="別邸">
            </div>
            <div class="grid-item-title">四分の二国（2025）</div>
            <div class="grid-item-hashtag">#2025 #グラフィック #展示什器</div>
        </a>

        <a href="#" class="grid-item">
            <div class="image-wrapper">
                <img src="images/ダミー画像.jpg" alt="その他のプロジェクト">
            </div>
            <div class="grid-item-title">Coming Soon</div>
            <div class="grid-item-hashtag">#未分類</div>
        </a>
    </div>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenu = document.getElementById('mobile-menu');
            const navMenu = document.getElementById('nav-menu');
            const navItems = document.querySelectorAll('.nav-item.has-dropdown');

            // ハンバーガーメニューの開閉
            mobileMenu.addEventListener('click', () => {
                mobileMenu.classList.toggle('active');
                navMenu.classList.toggle('active');
            });

            // SP版：ドロップダウンメニューの開閉
            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    if (window.innerWidth <= 768) {
                        item.classList.toggle('active');
                    }
                });
            });

            // 【要求③④】ハッシュタグの検索機能
            const searchInput = document.getElementById('search-input');
            const gridItems = document.querySelectorAll('.grid-item');

            searchInput.addEventListener('input', function() {
                const query = this.value.trim().toLowerCase();

                gridItems.forEach(item => {
                    const hashtagElem = item.querySelector('.grid-item-hashtag');
                    if (hashtagElem) {
                        const hashtagsText = hashtagElem.textContent.toLowerCase();
                        // 検索窓の文字がハッシュタグの内容に含まれているか判定
                        if (hashtagsText.includes(query)) {
                            item.style.display = 'block';
                        } else {
                            item.style.display = 'none';
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
