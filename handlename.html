<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Diehl - nikamishotaro computer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-left">
            <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">Kim Diehl</a>
        </div>

        <div id="post-list">
            <p>loading...</p>
        </div>

        <div class="header-right" id="nav-menu">
            <div class="nav-item has-dropdown">
                <a href="javascript:void(0)"><img src="images/sns-icon.png" alt="SNS" class="header-icon"></a>
                <div class="dropdown">
                    <a href="https://x.com/KimDiehl_" target="_blank">Twitter</a>
                    <a href="https://www.instagram.com/kimdiehl_/" target="_blank">Instagram</a>
                    <a href="https://note.com/kimdiehl_" target="_blank">note</a>
                </div>
            </div>
            <div class="nav-item">
                <a href="https://nikamishotaro.github.io/home/index.html"><img src="images/home-icon.png" alt="Back to Home" class="header-icon"></a>
            </div>
        </div>
    </header>

    <div class="search-area-wrapper">
        <div class="search-container">
            <div class="search-box">
                <div id="tags-container" class="tags-container"></div>
                <input type="text" id="search-input" class="search-input" placeholder="What are you interested in?">
            </div>
            <button id="search-btn" class="search-btn">search</button>
            <div class="sort-container">
                <select id="sort-select" class="sort-select">
                    <option value="date-desc">latest posts</option>
                    <option value="date-asc">earliest posts</option>
                    <option value="view-desc">most viewed</option>
                    <option value="view-asc">least viewed</option>
                </select>
            </div>
        </div>
        <div class="hot-search-wrapper">
            <div class="trending-label">🔥</div>
            <div class="hot-search" id="hot-search"></div>
        </div>
    </div>

    <div class="grid-container" id="grid-container"></div>

    <div id="image-modal" class="modal">
        <div class="modal-box" id="modal-inner-container">
            </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const postListElement = document.getElementById('post-list');
            const gridContainer = document.getElementById('grid-container');

            const owner = "nikamishotaro";
            const repo = "home";
            const path = "posts";
            
            // モーダル展開時のスクロールイベント誤作動をブロックするための管理フラグ
            let isOpeningModal = false;
            
            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`);
                if (response.ok) {
                    const files = await response.json();
                    if (postListElement) postListElement.innerHTML = "";
                    
                    for (const file of files) {
                        if (file.name.endsWith(".md")) {
                            const contentRes = await fetch(file.download_url);
                            const text = await contentRes.text();
                            
                            const titleMatch = text.match(/title:\s*"(.*?)"/);
                            const tagsMatch = text.match(/tags:\s*"(.*?)"/);
                            const iconUrlMatch = text.match(/iconUrl:\s*"(.*?)"/);
                            const imageMatch = text.match(/image:\s*"(.*?)"/);
                            const detailUrlMatch = text.match(/detailUrl:\s*"(.*?)"/);
                            const detailtextMatch = text.match(/detailtext:\s*"([\s\S]*?)"/);
                            
                            const title = titleMatch ? titleMatch[1] : "無題";
                            
                            // 「#」なしでもタグとして認識し、カンマ区切りにも対応する処理
                            let tags = "";
                            if (tagsMatch && tagsMatch[1]) {
                                const rawTagsText = tagsMatch[1];
                                const separator = rawTagsText.includes(',') ? ',' : ' ';
                                tags = rawTagsText.split(separator)
                                    .map(t => t.trim().replace(/^#/, ''))
                                    .filter(t => t !== '')
                                    .map(t => '#' + t)
                                    .join(' ');
                            }

                            const rawImageUrl = iconUrlMatch ? iconUrlMatch[1] : (imageMatch ? imageMatch[1] : "");
                            
                            const cleanIconUrl = rawImageUrl.replace(/[\r\n"]/g, '').trim();
                            const imageUrl = cleanIconUrl ? encodeURI(decodeURI(cleanIconUrl)) : "";

                            const detailUrl = detailUrlMatch ? detailUrlMatch[1] : "";
                            const detailtext = detailtextMatch ? detailtextMatch[1] : "";
                            
                            const dateMatch = file.name.match(/^(\d{4})(\d{2})(\d{2})(?:-(\d{2})(\d{2})(\d{2}))?/);
                            let dateStr = "2026-05-28T00:00:00"; 
                            if (dateMatch) {
                                const HH = dateMatch[4] || "00";
                                const mm = dateMatch[5] || "00";
                                const ss = dateMatch[6] || "00";
                                dateStr = `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}T${HH}:${mm}:${ss}`;
                            }
                            
                            const fileId = file.name.replace('.md', '');
                            
                            const itemA = document.createElement('a');
                            itemA.href = "#";
                            itemA.className = "grid-item";
                            itemA.dataset.id = "item-" + fileId;
                            itemA.dataset.date = dateStr; 
                            
                            if (detailUrl) {
                                itemA.dataset.detailUrl = detailUrl;
                            }
                            if (detailtext) {
                                itemA.dataset.detailtext = detailtext;
                            }
                            
                            itemA.innerHTML = `
                                <div class="image-wrapper">
                                    <img src="${imageUrl}" alt="${title}">
                                </div>
                                <div class="grid-item-title-container">
                                    <div class="grid-item-title">${title}</div>
                                    <div class="view-count">
                                        <img src="images/eye-icon.png" alt="views" class="eye-icon">
                                        <span class="view-number">0</span>
                                    </div>
                                </div>
                                <div class="grid-item-hashtag">${tags}</div>
                            `;
                            gridContainer.appendChild(itemA);
                        }
                    }
                }
            } catch (error) {
                if (postListElement) postListElement.innerHTML = "記事の読み込みに失敗しました。";
                console.error(error);
            }

            const navItems = document.querySelectorAll('.nav-item.has-dropdown');

            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    if (window.innerWidth <= 768) {
                        e.stopPropagation();
                        item.classList.toggle('active');
                    }
                });
            });

            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    navItems.forEach(item => {
                        if (!item.contains(e.target)) {
                            item.classList.remove('active');
                        }
                    });
                }
            });

            window.addEventListener('pageshow', () => {
                if (window.innerWidth <= 768) {
                    navItems.forEach(item => {
                        item.classList.remove('active');
                    });
                }
            });

            const searchInput = document.getElementById('search-input');
            const tagsContainer = document.getElementById('tags-container');
            const searchBtn = document.getElementById('search-btn');
            const hotSearchContainer = document.getElementById('hot-search');
            
            const gridItems = document.querySelectorAll('.grid-item');
            const itemsArray = Array.from(gridItems);

            function closeImageModal() {
                const modal = document.getElementById('image-modal');
                modal.style.display = 'none';
                modal.style.opacity = 1; 
                modal.scrollTop = 0; 
            }

            // ▼▼▼ 【重要】ここで取得したご自身のIDに書き換えてください ▼▼▼
            const KVDB_BUCKET = 'JRKXw7cbGwXbA7eR1AoC7y'; 
            
            let fetchCount = 0;

            itemsArray.forEach(item => {
                const id = item.dataset.id;
                const safeId = id.replace(/[^a-zA-Z0-9_]/g, '');
                const localKey = 'kim_diehl_views_' + safeId;
                
                let localViews = parseInt(localStorage.getItem(localKey) || '0');
                item.dataset.views = localViews;
                item.querySelector('.view-number').textContent = localViews;

                // ページ読み込み時に全端末合算の閲覧数を取得
                fetch(`https://kvdb.io/${KVDB_BUCKET}/${safeId}`)
                    .then(res => {
                        if(res.status === 404) return 0; // まだ誰も見ていない場合
                        if(!res.ok) throw new Error('API Error');
                        return res.text();
                    })
                    .then(data => {
                        const views = parseInt(data) || 0;
                        // ローカルよりAPIの数字が大きければ上書き
                        if (views >= localViews) {
                            item.dataset.views = views;
                            item.querySelector('.view-number').textContent = views;
                            localStorage.setItem(localKey, views);
                        } else if (localViews > views) {
                            // もしAPI側が初期化されていたらローカルの数字をAPIに送信して復元
                            fetch(`https://kvdb.io/${KVDB_BUCKET}/${safeId}`, {
                                method: 'POST',
                                body: localViews.toString()
                            });
                        }
                    })
                    .catch(err => console.log('閲覧数の取得に失敗（ローカル値を使用）:', err))
                    .finally(() => {
                        fetchCount++;
                        if (fetchCount === itemsArray.length) {
                            updateGrid();
                        }
                    });

                item.addEventListener('click', (e) => {
                    e.preventDefault(); 

                    // クリック時に見た目とローカル上の数値を+1する
                    let currentViews = parseInt(item.dataset.views || 0) + 1;
                    item.dataset.views = currentViews;
                    item.querySelector('.view-number').textContent = currentViews;
                    localStorage.setItem(localKey, currentViews);

                    // 【修正】KVdbに最新の閲覧数を直接「保存（上書き）」する（404エラー解消）
                    fetch(`https://kvdb.io/${KVDB_BUCKET}/${safeId}`, {
                        method: 'POST',
                        body: currentViews.toString()
                    }).catch(err => console.log('閲覧数の更新に失敗:', err));

                    const modal = document.getElementById('image-modal');
                    const innerContainer = document.getElementById('modal-inner-container');
                    
                    innerContainer.innerHTML = `
                        <div id="modal-title" class="modal-title"></div>
                        <div id="carousel-container" class="carousel-container"></div>
                        <div id="modal-text" class="modal-text"></div>
                    `;
                    
                    const titleEl = document.getElementById('modal-title');
                    const carouselEl = document.getElementById('carousel-container');
                    const textEl = document.getElementById('modal-text');
                    
                    const itemTitle = item.querySelector('.grid-item-title').textContent;
                    titleEl.textContent = itemTitle;

                    const detailUrl = item.dataset.detailUrl;
                    const detailtext = item.dataset.detailtext;
                    
                    let images = [];
                    if (detailUrl) {
                        images = detailUrl.split(',').map(u => u.replace(/[\r\n"]/g, '').trim()).filter(u => u !== '');
                    } else {
                        const fallbackSrc = item.querySelector('.image-wrapper img').src;
                        images = [fallbackSrc.replace(/[\r\n"]/g, '').trim()];
                    }
                    
                    if (images.length === 1) {
                        const img = document.createElement('img');
                        img.src = encodeURI(decodeURI(images[0]));
                        img.className = 'single-img';
                        carouselEl.style.height = 'auto'; 
                        carouselEl.appendChild(img);
                    } else if (images.length > 1) {
                        images.forEach((url, idx) => {
                            const img = document.createElement('img');
                            img.src = encodeURI(decodeURI(url));
                            img.className = 'carousel-img';
                            if (idx === 0) img.classList.add('active');
                            else if (idx === 1) img.classList.add('next');
                            else if (idx === images.length - 1) img.classList.add('prev');
                            carouselEl.appendChild(img);
                        });

                        let currentIndex = 0;
                        carouselEl.addEventListener('click', (ev) => {
                            const imgs = carouselEl.querySelectorAll('.carousel-img');
                            imgs.forEach(i => i.className = 'carousel-img');
                            
                            currentIndex = (currentIndex + 1) % imgs.length;
                            
                            imgs[currentIndex].classList.add('active');
                            imgs[(currentIndex - 1 + imgs.length) % imgs.length].classList.add('prev');
                            imgs[(currentIndex + 1) % imgs.length].classList.add('next');
                            ev.stopPropagation(); 
                        });
                    }
                    
                    if (detailtext) {
                        textEl.textContent = detailtext.replace(/\\n/g, '\n');
                        textEl.style.display = 'block';
                    } else {
                        textEl.style.display = 'none'; 
                    }
                    
                    isOpeningModal = true;
                    modal.style.display = 'block'; 
                    modal.scrollTop = 0; 
                    modal.style.opacity = 1; 
                    
                    setTimeout(() => {
                        isOpeningModal = false;
                    }, 80);

                });
            });
            
            let availableTags = [];
            let selectedTags = [];
            const tagCounts = {};

            itemsArray.forEach(item => {
                const hashtagElem = item.querySelector('.grid-item-hashtag');
                const year = item.dataset.date ? item.dataset.date.split('T')[0].split('-')[0] : '';
                if (year && !availableTags.includes(year)) {
                    availableTags.push(year);
                }

                if (hashtagElem) {
                    const text = hashtagElem.textContent;
                    const tags = text.split('#').map(t => t.trim()).filter(t => t !== '');
                    tags.forEach(t => {
                        if(!availableTags.includes(t)) {
                            availableTags.push(t);
                        }
                        tagCounts[t] = (tagCounts[t] || 0) + 1;
                    });
                }
            });

            const sortedTags = Object.keys(tagCounts).sort((a, b) => tagCounts[b] - tagCounts[a]).slice(0, 5);
            sortedTags.forEach(t => {
                const span = document.createElement('span');
                span.className = 'hot-search-item';
                span.textContent = '#' + t;
                span.addEventListener('click', () => {
                    if (!selectedTags.includes(t)) {
                        addTag(t);
                    }
                });
                hotSearchContainer.appendChild(span);
            });

            function renderTags() {
                tagsContainer.innerHTML = '';
                selectedTags.forEach(t => {
                    const tagEl = document.createElement('div');
                    tagEl.className = 'search-tag';
                    tagEl.innerHTML = `<span>#${t}</span> <span class="remove-tag">×</span>`;
                    tagEl.querySelector('.remove-tag').addEventListener('click', (e) => {
                        e.stopPropagation(); 
                        removeTag(t);
                    });
                    tagsContainer.appendChild(tagEl);
                });
                updateSearchState(); 
            }

            function addTag(tag) {
                selectedTags.push(tag);
                renderTags();
                updateGrid(); 
            }

            function removeTag(tag) {
                selectedTags = selectedTags.filter(t => t !== tag);
                renderTags();
                updateGrid(); 
            }

            function updateSearchState() {
                if (selectedTags.length === 0) {
                    searchBtn.textContent = 'search';
                    searchBtn.className = 'search-btn';
                } else {
                    let hits = 0;
                    itemsArray.forEach(item => {
                        const hashtagElem = item.querySelector('.grid-item-hashtag');
                        const itemTags = hashtagElem ? hashtagElem.textContent : '';
                        const itemYear = item.dataset.date ? item.dataset.date.split('T')[0].split('-')[0] : '';
                        const isMatch = selectedTags.every(st => itemTags.includes('#' + st) || itemYear === st);
                        if (isMatch) hits++;
                    });
                    searchBtn.textContent = hits + ' hit';
                    searchBtn.className = 'search-btn active';
                }
            }

            searchInput.addEventListener('input', (e) => {
                let val = e.target.value.trim();
                if(val.startsWith('#')) val = val.substring(1);
                
                if (availableTags.includes(val) && !selectedTags.includes(val)) {
                    addTag(val);
                    e.target.value = ''; 
                }
            });

            function updateGrid() {
                const sortValue = document.getElementById('sort-select').value;
                
                itemsArray.sort((a, b) => {
                    if (sortValue === 'date-desc') {
                        return new Date(b.dataset.date) - new Date(a.dataset.date);
                    } else if (sortValue === 'date-asc') {
                        return new Date(a.dataset.date) - new Date(b.dataset.date);
                    } else if (sortValue === 'view-desc') {
                        return parseInt(b.dataset.views) - parseInt(a.dataset.views);
                    } else if (sortValue === 'view-asc') {
                        return parseInt(a.dataset.views) - parseInt(b.dataset.views);
                    }
                });

                gridContainer.innerHTML = '';
                let currentYearMonth = ''; 

                itemsArray.forEach(item => {
                    const hashtagElem = item.querySelector('.grid-item-hashtag');
                    const itemTags = hashtagElem ? hashtagElem.textContent : '';
                    const dateParts = item.dataset.date ? item.dataset.date.split('T')[0].split('-') : [];
                    const itemYear = dateParts.length > 0 ? dateParts[0] : '';
                    const itemYearMonth = dateParts.length > 1 ? `${dateParts[0]}.${parseInt(dateParts[1], 10)}` : '';
                    
                    let isMatch = true;
                    if (selectedTags.length > 0) {
                        isMatch = selectedTags.every(st => itemTags.includes('#' + st) || itemYear === st);
                    }
                    item.style.display = isMatch ? 'block' : 'none';

                    if (isMatch) {
                        if (sortValue.startsWith('date')) {
                            if (itemYearMonth && itemYearMonth !== currentYearMonth) {
                                const divider = document.createElement('div');
                                divider.className = 'year-divider';
                                divider.textContent = itemYearMonth;
                                gridContainer.appendChild(divider);
                                currentYearMonth = itemYearMonth;
                            }
                        }
                    }
                    gridContainer.appendChild(item);
                });
            }

            document.getElementById('sort-select').addEventListener('change', updateGrid);

            let currentZoom = 1; 
            let initialDistance = null;
            let isZooming = false;
            const zoomThreshold = 40; 

            if (window.innerWidth <= 768) {
                gridContainer.className = 'grid-container zoom-' + currentZoom;
            }

            document.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2 && window.innerWidth <= 768) {
                    initialDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    isZooming = true;
                }
            }, {passive: false});

            document.addEventListener('touchmove', (e) => {
                if (isZooming && e.touches.length === 2 && window.innerWidth <= 768) {
                    e.preventDefault(); 
                    const currentDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );

                    if (initialDistance) {
                        const MathDiff = currentDistance - initialDistance;
                        if (MathDiff > zoomThreshold) {
                            changeZoom(-1);
                            initialDistance = currentDistance;
                        } else if (MathDiff < -zoomThreshold) {
                            changeZoom(1);
                            initialDistance = currentDistance;
                        }
                    }
                }
            }, {passive: false});

            document.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    isZooming = false;
                    initialDistance = null;
                }
            });

            function changeZoom(dir) {
                currentZoom += dir;
                if (currentZoom < 0) currentZoom = 0; 
                if (currentZoom > 3) currentZoom = 3; 
                gridContainer.className = 'grid-container zoom-' + currentZoom;
            }

            updateGrid();

            const imageModal = document.getElementById('image-modal');
            
            imageModal.addEventListener('click', (e) => {
                if (e.target === imageModal) {
                    closeImageModal();
                }
            });

            imageModal.addEventListener('scroll', () => {
                if (imageModal.style.display === 'none' || isOpeningModal) return; 

                if (window.innerWidth <= 768) {
                    const scrollTop = imageModal.scrollTop;
                    const maxScroll = imageModal.scrollHeight - imageModal.clientHeight;
                    
                    if (maxScroll > 50) {
                        const remainingScroll = maxScroll - scrollTop;
                        let currentOpacity = 1;
                        
                        const opacityThreshold = 400; 
                        if (remainingScroll < opacityThreshold) {
                            currentOpacity = Math.max(0, remainingScroll / opacityThreshold);
                        }
                        
                        imageModal.style.opacity = currentOpacity;

                        if (remainingScroll <= 1) {
                            closeImageModal();
                        }
                    }
                }
            });

        });
    </script>
</body>
</html>
